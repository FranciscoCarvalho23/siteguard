[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siteguard"
version = "1.0.0"
description = "PPE compliance detection for construction sites: fine-tuned YOLO11, ONNX Runtime serving, FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["onnxruntime>=1.17", "opencv-python>=4.8", "numpy>=1.24"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
train = ["ultralytics>=8.3", "onnx>=1.15", "onnxslim>=0.1"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
siteguard = "siteguard.cli:main"

[tool.setuptools.packages.find]
include = ["siteguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 125
target-version = "py310"
extend-exclude = ["runs", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File(...) / Query(...) defaults

[tool.ruff.lint.isort]
known-first-party = ["siteguard", "api", "conftest", "evaluate"]
